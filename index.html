<!DOCTYPE html>

<head>

    <!-- Telegram WebApp SDK (MUST BE FIRST) -->

    <!-- Fonts & Icons (Loaded early) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Only (Tailwind + Custom) -->
    <style>
        /* CRITICAL CSS - Loads first */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #ffffff; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Essential Loading States */
        .main-page { display: none; }
        .main-page.active { display: flex; animation: fadeIn 0.5s ease-in-out; }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        
        /* Ad Loading Indicator */
        .ad-loading-indicator {
            position: fixed;
            top: 70px;
            right: 10px;
            background: linear-gradient(45deg, rgba(241, 196, 15, 0.8), rgba(243, 156, 18, 0.8));
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 99;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Essential Animations */
        .premium-loader {
            width: 70px;
            height: 70px;
            border: 3px solid rgba(250, 204, 21, 0.1);
            border-radius: 50%;
            border-top-color: #facc15;
            animation: spin 1s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
        }
        
        /* Hidden utility */
        .hidden { display: none !important; }
    </style>
    
    <!-- Rest of styles moved to end for faster page load -->
</head>
<body class="max-w-md mx-auto">

    <!-- Ad Loading Popup -->

    <!-- Main App Container -->

        <!-- Ad Status Indicator -->

        <header class="p-5 flex items-center justify-between header-gradient">

    <div id="custom-alert" class="alert-modal hidden">

        </div>

    <!-- OPTIMIZED JAVASCRIPT - Loaded last for faster page render -->
    <script>
        // ========== CORE CONFIGURATION ==========
        const CONFIG = {
            firebase: {
                apiKey: "AIzaSyBEvTvWy-hH1HHgjoOhUKkj-Dglm11Oc8U",
                authDomain: "cash-rewards-01-624ae.firebaseapp.com",
                projectId: "cash-rewards-01-624ae",
                storageBucket: "cash-rewards-01-624ae.firebasestorage.app",
                messagingSenderId: "29119912449",
                appId: "1:29119912449:web:e0c68c1994ff0a71603e00"
            },
            adNetworks: {
                gigapubId: "978",
                richadsPubId: "956231",
                richadsAppId: "5972",
                adsgramRewardId: "21145",
                adsgramInterstitialId: "int-21144"
            },
            games: {
                ludoDice: { gameCost: 10, winMultiplier: 10, dailyLimit: 50 },
                colorGame: { reward: 100, dailyLimit: 30 },
                watchVideo: { reward: 50, dailyLimit: 100 },
                tryYourLuck: { reward: 500, dailyLimit: 10 }
            }
        };

        // ========== CORE STATE ==========
        let currentUser = null;
        let userData = null;
        let appConfig = {};
        let adSDKs = {
            gigapub: { loaded: false, ready: false },
            richads: { loaded: false, ready: false },
            adsgram: { loaded: false, ready: false },
            adexium: { loaded: false, ready: false }
        };
        let currentGame = null;
        let currentAdProvider = null;

        // ========== FAST AD LOADING SYSTEM ==========
        class AdManager {
            constructor() {
                this.rotationIndex = 0;
                this.availableNetworks = [];
            }

            async preloadCriticalAdSDKs() {
                console.log("⚡ Preloading critical ad SDKs...");
                
                // Load Gigapub first (highest priority)
                if (CONFIG.adNetworks.gigapubId) {
                    await this.loadGigapubSDK();
                }
                
                // Load Richads in parallel
                if (CONFIG.adNetworks.richadsPubId) {
                    this.loadRichAdsSDK();
                }
                
                // Load AdsGram
                this.loadAdsGramSDK();
                
                console.log("✅ Critical ad SDKs preloading started");
            }

            async loadGigapubSDK() {
                if (adSDKs.gigapub.loaded) return true;
                
                return new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = `https://ad.gigapub.tech/script?id=${CONFIG.adNetworks.gigapubId}`;
                    script.async = true;
                    script.defer = true;
                    
                    script.onload = () => {
                        adSDKs.gigapub.loaded = true;
                        adSDKs.gigapub.ready = true;
                        console.log("✅ Gigapub SDK loaded");
                        this.updateAdStatus();
                        resolve(true);
                    };
                    
                    script.onerror = () => {
                        console.log("❌ Gigapub SDK failed to load");
                        resolve(false);
                    };
                    
                    document.head.appendChild(script);
                });
            }

            loadRichAdsSDK() {
                if (adSDKs.richads.loaded) return;
                
                const script = document.createElement('script');
                script.src = 'https://richinfo.co/richpartners/telegram/js/tg-ob.js';
                script.async = true;
                
                script.onload = () => {
                    adSDKs.richads.loaded = true;
                    window.telegramAdsController = new TelegramAdsController();
                    window.telegramAdsController.initialize({
                        pubId: CONFIG.adNetworks.richadsPubId,
                        appId: CONFIG.adNetworks.richadsAppId,
                    });
                    adSDKs.richads.ready = true;
                    console.log("✅ RichAds SDK loaded");
                    this.updateAdStatus();
                };
                
                document.head.appendChild(script);
            }

            loadAdsGramSDK() {
                if (adSDKs.adsgram.loaded) return;
                
                const script = document.createElement('script');
                script.src = 'https://adsgram.com/adsgram.min.js';
                script.async = true;
                
                script.onload = () => {
                    adSDKs.adsgram.loaded = true;
                    // Initialize AdsGram
                    if (typeof Adsgram !== 'undefined') {
                        window.adsGramRewardController = Adsgram.init({ blockId: CONFIG.adNetworks.adsgramRewardId });
                        window.adsGramInterstitialController = Adsgram.init({ blockId: CONFIG.adNetworks.adsgramInterstitialId });
                        adSDKs.adsgram.ready = true;
                    }
                    console.log("✅ AdsGram SDK loaded");
                    this.updateAdStatus();
                };
                
                document.head.appendChild(script);
            }

            async loadAdexiumSDK() {
                if (adSDKs.adexium.loaded) return true;
                
                return new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.tgads.space/assets/js/adexium-widget.min.js';
                    script.async = true;
                    
                    script.onload = () => {
                        adSDKs.adexium.loaded = true;
                        window.adexiumWidget = new AdexiumWidget({
                            wid: '30015b9a-df1e-4895-be7b-c5bc1b148fcf',
                            adFormat: 'interstitial'
                        });
                        adSDKs.adexium.ready = true;
                        console.log("✅ Adexium SDK loaded");
                        this.updateAdStatus();
                        resolve(true);
                    };
                    
                    script.onerror = () => {
                        console.log("❌ Adexium SDK failed to load");
                        resolve(false);
                    };
                    
                    document.head.appendChild(script);
                });
            }

            async showAd(gameType) {
                // Check if any ads are available
                const available = this.getAvailableNetworks();
                if (available.length === 0) {
                    throw new Error("No ad networks available");
                }

                // Get next network in rotation
                const network = available[this.rotationIndex % available.length];
                this.rotationIndex++;
                
                console.log(`🎯 Showing ${network} ad for ${gameType}`);
                currentAdProvider = network;
                this.updateAdProviderDisplay(network);
                
                // Show loading popup
                showAdLoadingPopup(`Loading ${network} ad...`);
                
                try {
                    const result = await this.showNetworkAd(network);
                    hideAdLoadingPopup();
                    
                    console.log(`✅ ${network} ad completed`);
                    return { network, success: true, result };
                } catch (error) {
                    hideAdLoadingPopup();
                    console.log(`❌ ${network} ad failed:`, error.message);
                    
                    // Try next network
                    const nextIndex = (this.rotationIndex) % available.length;
                    if (nextIndex !== 0) { // Don't try all networks endlessly
                        console.log(`🔄 Trying next ad network...`);
                        return this.showAd(gameType);
                    }
                    
                    throw new Error("All ad networks failed");
                }
            }

            async showNetworkAd(network) {
                switch(network) {
                    case 'gigapub':
                        return this.showGigapubAd();
                    case 'richads':
                        return this.showRichAdsAd();
                    case 'adsgram':
                        return this.showAdsGramAd();
                    case 'adexium':
                        return this.showAdexiumAd();
                    default:
                        throw new Error(`Unknown network: ${network}`);
                }
            }

            async showGigapubAd() {
                if (!adSDKs.gigapub.ready) {
                    throw new Error("Gigapub not ready");
                }

                return new Promise((resolve, reject) => {
                    // Gigapub typically auto-shows ads when loaded
                    // Simulate ad completion with timeout
                    setTimeout(() => {
                        resolve({ completed: true, provider: 'Gigapub' });
                    }, 3000); // Simulated ad duration
                });
            }

            async showRichAdsAd() {
                if (!adSDKs.richads.ready || !window.telegramAdsController) {
                    throw new Error("RichAds not ready");
                }

                return new Promise((resolve, reject) => {
                    try {
                        window.telegramAdsController.triggerInterstitialBanner();
                        setTimeout(() => {
                            resolve({ completed: true, provider: 'RichAds' });
                        }, 3000);
                    } catch (error) {
                        reject(error);
                    }
                });
            }

            async showAdsGramAd() {
                if (!adSDKs.adsgram.ready || !window.adsGramRewardController) {
                    throw new Error("AdsGram not ready");
                }

                return window.adsGramRewardController.show();
            }

            async showAdexiumAd() {
                if (!adSDKs.adexium.ready || !window.adexiumWidget) {
                    const loaded = await this.loadAdexiumSDK();
                    if (!loaded) throw new Error("Adexium not available");
                }

                return new Promise((resolve, reject) => {
                    try {
                        window.adexiumWidget.show();
                        window.adexiumWidget.on('close', () => {
                            resolve({ completed: true, provider: 'Adexium' });
                        });
                        window.adexiumWidget.on('error', reject);
                        
                        // Timeout after 30 seconds
                        setTimeout(() => reject(new Error("Adexium timeout")), 30000);
                    } catch (error) {
                        reject(error);
                    }
                });
            }

            getAvailableNetworks() {
                const networks = [];
                if (adSDKs.gigapub.ready) networks.push('gigapub');
                if (adSDKs.richads.ready) networks.push('richads');
                if (adSDKs.adsgram.ready) networks.push('adsgram');
                if (adSDKs.adexium.ready) networks.push('adexium');
                return networks;
            }

            updateAdStatus() {
                const adStatusElement = document.getElementById('adStatusDisplay');
                const adStatusText = document.getElementById('adStatusText');
                
                if (!adStatusElement) return;
                
                const available = this.getAvailableNetworks();
                
                if (available.length > 0) {
                    adStatusElement.style.background = 'linear-gradient(45deg, rgba(46, 204, 113, 0.8), rgba(39, 174, 96, 0.8))';
                    adStatusText.textContent = `${available.length} Ad Networks Ready`;
                    adStatusElement.innerHTML = `<i class="fas fa-check w-4 h-4"></i><span>${adStatusText.textContent}</span>`;
                } else {
                    adStatusElement.style.background = 'linear-gradient(45deg, rgba(241, 196, 15, 0.8), rgba(243, 156, 18, 0.8))';
                    adStatusText.textContent = 'Loading Ads...';
                    adStatusElement.innerHTML = `<i class="fas fa-spinner animate-spin w-4 h-4"></i><span>${adStatusText.textContent}</span>`;
                }
            }

            updateAdProviderDisplay(provider) {
                const providerEl = document.getElementById('ad-provider-name');
                if (providerEl) {
                    providerEl.textContent = `Provider: ${provider}`;
                }
            }
        }

        // ========== GAME MANAGER ==========
        class GameManager {
            constructor() {
                this.adManager = new AdManager();
                this.currentGame = null;
                this.gameState = {};
            }

            async playGame(gameType, gameConfig = {}) {
                // Set current game
                currentGame = gameType;
                
                // Check if user can play
                if (!await this.canPlayGame(gameType)) {
                    return false;
                }

                // Check balance for paid games
                if (gameConfig.cost && (!userData || userData.balance < gameConfig.cost)) {
                    showAlert(`❌ You need at least ${gameConfig.cost} points to play!`);
                    return false;
                }

                // Deduct cost if any
                if (gameConfig.cost) {
                    await this.updateBalance(-gameConfig.cost, `${gameType}_cost`, `Paid ${gameConfig.cost} points`);
                }

                return true;
            }

            async completeGame(gameType, reward, adRequired = true) {
                if (adRequired) {
                    try {
                        // Show ad first
                        const adResult = await this.adManager.showAd(gameType);
                        
                        if (!adResult.success) {
                            // If ad fails, refund cost if any
                            const gameConfig = CONFIG.games[gameType] || {};
                            if (gameConfig.cost) {
                                await this.updateBalance(gameConfig.cost, 'refund', 'Ad failed - refund');
                            }
                            throw new Error("Ad failed - no points added");
                        }

                        // Only add points if ad was successful
                        await this.updateBalance(reward, gameType, `Won ${reward} points from ${adResult.network} ad`);
                        
                        // Update game stats
                        await this.incrementGamePlay(gameType);
                        
                        return { success: true, reward, adNetwork: adResult.network };
                    } catch (error) {
                        console.log(`❌ Game completion failed: ${error.message}`);
                        return { success: false, error: error.message };
                    }
                } else {
                    // No ad required, just add points
                    await this.updateBalance(reward, gameType, `Won ${reward} points`);
                    await this.incrementGamePlay(gameType);
                    return { success: true, reward };
                }
            }

            async canPlayGame(gameType) {
                if (!userData) return false;
                
                const today = new Date().toISOString().split('T')[0];
                const playField = `${gameType}PlaysToday`;
                const dailyPlays = userData[playField] || 0;
                const dailyLimit = (CONFIG.games[gameType] || {}).dailyLimit || 0;
                
                if (dailyLimit > 0 && dailyPlays >= dailyLimit) {
                    showAlert(`❌ Daily limit of ${dailyLimit} plays reached!`);
                    return false;
                }
                
                return true;
            }

            async incrementGamePlay(gameType) {
                if (!currentUser) return;
                
                const today = new Date().toISOString().split('T')[0];
                const playField = `${gameType}PlaysToday`;
                
                userData[playField] = (userData[playField] || 0) + 1;
                userData.lastGamePlayDate = today;
                
                // Save to localStorage
                localStorage.setItem('userData', JSON.stringify(userData));
                
                // Update UI
                this.updatePlayCountDisplay();
            }

            updatePlayCountDisplay() {
                if (!userData) return;
                
                Object.keys(CONFIG.games).forEach(gameType => {
                    const playField = `${gameType}PlaysToday`;
                    const dailyPlays = userData[playField] || 0;
                    const dailyLimit = CONFIG.games[gameType].dailyLimit || 0;
                    
                    const displayEl = document.getElementById(`${gameType}-play-count-display`);
                    if (displayEl && dailyLimit > 0) {
                        displayEl.textContent = `Today: ${dailyPlays}/${dailyLimit}`;
                        displayEl.style.display = 'block';
                    }
                });
            }

            async updateBalance(amount, type, description) {
                if (!userData || amount === 0) return;
                
                const currentBalance = parseFloat(userData.balance) || 0;
                const newBalance = Math.max(0, (currentBalance + amount).toFixed(2));
                
                userData.balance = parseFloat(newBalance);
                
                if (amount > 0) {
                    userData.totalEarned = (userData.totalEarned || 0) + amount;
                    userData.tasksCompleted = (userData.tasksCompleted || 0) + 1;
                }
                
                // Save to localStorage
                localStorage.setItem('userData', JSON.stringify(userData));
                
                // Update UI
                updateAllUI();
                console.log(`💰 Balance updated: ${amount > 0 ? '+' : ''}${amount} (${description})`);
            }
        }

        // ========== CORE APP FUNCTIONS ==========
        const gameManager = new GameManager();

        async function initializeApp() {
            showLoader();
            
            try {
                // Initialize Telegram
                await initializeTelegramUser();
                
                // Preload ads
                await gameManager.adManager.preloadCriticalAdSDKs();
                
                // Load user data
                await loadUserData();
                
                // Start app
                hideLoader();
                startApp();
                
                // Update ad status after a delay
                setTimeout(() => gameManager.adManager.updateAdStatus(), 2000);
                
            } catch (error) {
                console.error("App initialization failed:", error);
                hideLoader();
                showAlert("Failed to initialize app. Please refresh.");
            }
        }

        async function initializeTelegramUser() {
            if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                
                const tgUser = tg.initDataUnsafe?.user;
                if (tgUser) {
                    const userId = `tg_${tgUser.id}`;
                    const userName = tgUser.first_name || tgUser.username || 'Telegram User';
                    
                    currentUser = { uid: userId, telegramId: tgUser.id, name: userName };
                    
                    document.getElementById('header-profile-name').textContent = `Hi, ${userName}`;
                    
                    if (tgUser.photo_url) {
                        document.getElementById('profile-picture').src = tgUser.photo_url;
                    }
                }
            } else {
                // Browser user
                const userId = `browser_${Date.now()}`;
                currentUser = { uid: userId, name: 'Browser User' };
            }
        }

        async function loadUserData() {
            if (!currentUser) return;
            
            const savedData = localStorage.getItem('userData');
            if (savedData) {
                userData = JSON.parse(savedData);
            } else {
                // Create new user
                userData = {
                    uid: currentUser.uid,
                    name: currentUser.name,
                    balance: 100,
                    totalEarned: 0,
                    tasksCompleted: 0,
                    referralCode: Math.random().toString(36).substring(2, 8).toUpperCase(),
                    dailyAdCount: 0,
                    lastAdWatchDate: '1970-01-01',
                    visitedSitesToday: [],
                    completedSocialTasks: [],
                    ludoDicePlaysToday: 0,
                    colorGamePlaysToday: 0,
                    watchVideoPlaysToday: 0,
                    tryYourLuckPlaysToday: 0,
                    lastGamePlayDate: new Date().toISOString().split('T')[0]
                };
                
                localStorage.setItem('userData', JSON.stringify(userData));
            }
            
            updateAllUI();
            gameManager.updatePlayCountDisplay();
        }

        function updateAllUI() {
            if (!userData) return;
            
            // Update header
            document.getElementById('header-profile-name').textContent = `Hi, ${userData.name}`;
            document.getElementById('header-coin-balance').textContent = parseFloat(userData.balance || 0).toFixed(2);
            
            // Update profile picture
            const profilePic = document.getElementById('profile-picture');
            if (!profilePic.src) {
                const initial = userData.name.charAt(0).toUpperCase();
                profilePic.src = `https://placehold.co/100x100/1e1e1e/facc15?text=${initial}`;
            }
        }

        // ========== GAME FUNCTIONS ==========
        window.startLudoGame = async function() {
            const gameConfig = CONFIG.games.ludoDice;
            
            const canPlay = await gameManager.playGame('ludoDice', { cost: gameConfig.gameCost });
            if (!canPlay) return;
            
            // Simulate dice roll
            const diceResult = Math.floor(Math.random() * 6) + 1;
            const winAmount = diceResult * gameConfig.winMultiplier;
            
            // Show result
            document.getElementById('dice-result-face').textContent = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'][diceResult - 1];
            document.getElementById('dice-win-amount').textContent = `${winAmount} POINTS`;
            document.getElementById('dice-result-popup').classList.remove('hidden');
            
            // Setup claim button
            document.getElementById('dice-claim-btn').onclick = async function() {
                const result = await gameManager.completeGame('ludoDice', winAmount + 5); // +5 bonus
                if (result.success) {
                    showAlert(`🎉 You earned ${result.reward} points!`);
                    document.getElementById('dice-result-popup').classList.add('hidden');
                } else {
                    showAlert(`❌ ${result.error}`);
                }
            };
        };

        window.startColorGame = async function() {
            const canPlay = await gameManager.playGame('colorGame');
            if (!canPlay) return;
            
            // Show color game page
            navigateTo('color-game-page');
            
            // Simple color matching game
            const colors = ['#FF6B6B', '#4ECDC4', '#FFD93D', '#6C5CE7', '#A29BFE', '#FD79A8'];
            const targetColor = colors[Math.floor(Math.random() * colors.length)];
            
            document.getElementById('target-color-box').style.backgroundColor = targetColor;
            
            // Setup color options
            const optionsGrid = document.getElementById('color-options-grid');
            optionsGrid.innerHTML = '';
            
            colors.forEach(color => {
                const div = document.createElement('div');
                div.className = 'color-option';
                div.style.backgroundColor = color;
                div.onclick = async function() {
                    if (color === targetColor) {
                        const result = await gameManager.completeGame('colorGame', CONFIG.games.colorGame.reward);
                        if (result.success) {
                            showAlert(`🎉 You earned ${result.reward} points!`);
                            navigateTo('home-page');
                        }
                    } else {
                        showAlert('❌ Wrong color! Try again.');
                    }
                };
                optionsGrid.appendChild(div);
            });
        };

        window.watchAndEarn = async function() {
            const canPlay = await gameManager.playGame('watchVideo');
            if (!canPlay) return;
            
            const result = await gameManager.completeGame('watchVideo', CONFIG.games.watchVideo.reward);
            if (result.success) {
                showAlert(`🎉 You earned ${result.reward} points from ${result.adNetwork || 'ad'}!`);
            } else {
                showAlert(`❌ ${result.error}`);
            }
        };

        window.tryYourLuck = async function() {
            const canPlay = await gameManager.playGame('tryYourLuck');
            if (!canPlay) return;
            
            showAdLoadingPopup("Loading multiple ads...");
            
            try {
                // Try to show ads from multiple networks
                const networks = gameManager.adManager.getAvailableNetworks();
                let successfulAds = 0;
                
                for (let i = 0; i < Math.min(3, networks.length); i++) {
                    try {
                        await gameManager.adManager.showNetworkAd(networks[i]);
                        successfulAds++;
                    } catch (error) {
                        console.log(`Ad ${networks[i]} failed:`, error.message);
                    }
                }
                
                hideAdLoadingPopup();
                
                if (successfulAds === 0) {
                    throw new Error("All ads failed");
                }
                
                // Calculate reward based on successful ads
                const baseReward = CONFIG.games.tryYourLuck.reward;
                const reward = Math.floor((successfulAds / 3) * baseReward);
                
                await gameManager.updateBalance(reward, 'try_your_luck', `Won ${reward} from Try Your Luck`);
                await gameManager.incrementGamePlay('tryYourLuck');
                
                showAlert(`🎉 You watched ${successfulAds} ads and earned ${reward} points!`);
                
            } catch (error) {
                hideAdLoadingPopup();
                showAlert(`❌ ${error.message}`);
            }
        };

        // ========== UI FUNCTIONS ==========
        function showLoader() {
            document.getElementById('loader').classList.remove('hidden');
        }

        function hideLoader() {
            document.getElementById('loader').classList.add('hidden');
        }

        function showAdLoadingPopup(message) {
            const popup = document.getElementById('ad-loading-popup');
            const messageEl = document.getElementById('ad-loading-message');
            
            if (messageEl) messageEl.textContent = message || 'Loading advertisement...';
            if (popup) popup.classList.remove('hidden');
        }

        function hideAdLoadingPopup() {
            const popup = document.getElementById('ad-loading-popup');
            if (popup) popup.classList.add('hidden');
        }

        function showAlert(message) {
            const alertBox = document.getElementById('custom-alert');
            const messageEl = document.getElementById('alert-message');
            
            if (messageEl) messageEl.textContent = message;
            if (alertBox) alertBox.classList.remove('hidden');
            
            // Auto-close after 3 seconds
            setTimeout(() => {
                if (alertBox) alertBox.classList.add('hidden');
            }, 3000);
        }

        function navigateTo(pageId) {
            // Hide all pages
            document.querySelectorAll('.sub-page').forEach(page => {
                page.classList.remove('active');
                page.classList.add('hidden');
            });
            
            // Show requested page
            const page = document.getElementById(pageId);
            if (page) {
                page.classList.remove('hidden');
                page.classList.add('active');
            }
            
            // Update navigation
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === pageId);
            });
            
            // Show/hide back button
            const backBtn = document.getElementById('back-button-container');
            if (backBtn) {
                backBtn.classList.toggle('hidden', pageId === 'home-page');
            }
        }

        function startApp() {
            document.getElementById('app-container').classList.add('active');
            
            // Setup navigation
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    navigateTo(this.dataset.page);
                });
            });
            
            // Setup alert close
            document.getElementById('alert-ok-btn').addEventListener('click', function() {
                document.getElementById('custom-alert').classList.add('hidden');
            });
            
            // Load home page content
            loadHomePage();
        }

        function loadHomePage() {
            const homePage = document.getElementById('home-page');
            if (!homePage) return;
            
            homePage.innerHTML = `
                <div class="premium-card p-5 rounded-2xl text-center">
                    <h1 class="text-2xl font-bold mb-2 gold-text">Welcome to CashReward <i class="fas fa-crown ml-2"></i></h1>
                    <p class="text-gray-300">Complete tasks, play games & earn real money!</p>
                </div>
                
                <div class="grid grid-cols-2 gap-6">
                    <div onclick="startColorGame()" class="feature-btn">
                        <div class="mb-3">
                            <div class="game-icon color-game">
                                <i class="fas fa-palette text-2xl"></i>
                            </div>
                        </div>
                        <span class="text-lg gold-text">Color Game</span>
                        <p class="text-sm text-gray-300 mt-1">Win up to ${CONFIG.games.colorGame.reward} coins</p>
                    </div>
                    
                    <div onclick="watchAndEarn()" class="feature-btn">
                        <div class="mb-3">
                            <div class="game-icon watch-video">
                                <i class="fas fa-play-circle text-2xl"></i>
                            </div>
                        </div>
                        <span class="text-lg gold-text">Watch & Earn</span>
                        <p class="text-sm text-gray-300 mt-1">Instant ${CONFIG.games.watchVideo.reward} coins</p>
                    </div>
                    
                    <div onclick="startLudoGame()" class="feature-btn">
                        <div class="mb-3">
                            <div class="game-icon ludo-dice">
                                <i class="fas fa-dice text-2xl"></i>
                            </div>
                        </div>
                        <span class="text-lg gold-text">Ludo Dice</span>
                        <p class="text-sm text-gray-300 mt-1">Play for ${CONFIG.games.ludoDice.gameCost} points</p>
                    </div>
                    
                    <div onclick="tryYourLuck()" class="feature-btn">
                        <div class="mb-3">
                            <div class="game-icon try-luck">
                                <i class="fas fa-star text-2xl"></i>
                            </div>
                        </div>
                        <span class="text-lg gold-text">Try Your Luck</span>
                        <p class="text-sm text-gray-300 mt-1">Win up to ${CONFIG.games.tryYourLuck.reward} points</p>
                    </div>
                </div>
            `;
        }

        // ========== START APP ==========
        window.onload = initializeApp;
    </script>
